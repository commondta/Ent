<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="inner">
      <rect x="38" y="38" width="436" height="436" rx="70" ry="70"/>
    </clipPath>
    <clipPath id="landclip">
      <path d="M 4,300 C 120,286 190,296 256,298 C 330,300 400,290 508,306 L 508,512 L 4,512 Z"/>
    </clipPath>
    <mask id="mark" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="black"/>
      <!-- outer rounded box -->
      <rect x="24" y="24" width="464" height="464" rx="82" ry="82" fill="none" stroke="white" stroke-width="18"/>
      <g clip-path="url(#inner)">
        <!-- land -->
        <path d="M 4,300 C 120,286 190,296 256,298 C 330,300 400,290 508,306 L 508,512 L 4,512 Z" fill="white"/>
        <!-- single land division line -->
        <path d="M 20,350 C 125,360 210,390 285,430 C 365,470 430,485 510,500" fill="none" stroke="black" stroke-width="13" stroke-linecap="round"/>
        <!-- element 1: tower crane -->
        <g fill="black" stroke="black" stroke-width="18" stroke-linejoin="round">
          <rect x="86" y="126" width="150" height="21" rx="3"/>
          <rect x="88" y="147" width="30" height="27" rx="3"/>
          <rect x="122" y="140" width="24" height="170"/>
          <rect x="102" y="306" width="64" height="24" rx="5"/>
          <rect x="174" y="147" width="10" height="44"/>
          <rect x="162" y="191" width="34" height="24" rx="4"/>
        </g>
        <g fill="white" stroke="none">
          <rect x="86" y="126" width="150" height="21" rx="3"/>
          <rect x="88" y="147" width="30" height="27" rx="3"/>
          <rect x="122" y="140" width="24" height="170"/>
          <rect x="102" y="306" width="64" height="24" rx="5"/>
          <rect x="174" y="147" width="10" height="44"/>
          <rect x="162" y="191" width="34" height="24" rx="4"/>
        </g>
        <!-- element 2: crawler crane -->
        <line x1="360" y1="272" x2="250" y2="166" fill="none" stroke="black" stroke-width="39" stroke-linecap="round"/>
        <line x1="360" y1="272" x2="250" y2="166" fill="none" stroke="white" stroke-width="21" stroke-linecap="round"/>
        <g fill="black" stroke="black" stroke-width="18" stroke-linejoin="round">
          <rect x="245" y="172" width="10" height="52"/>
          <rect x="229" y="224" width="42" height="28" rx="4"/>
        </g>
        <g fill="white" stroke="none">
          <rect x="245" y="172" width="10" height="52"/>
          <rect x="229" y="224" width="42" height="28" rx="4"/>
        </g>
        <!-- crawler base -->
        <g fill="black" stroke="black" stroke-width="18" stroke-linejoin="round">
          <rect x="292" y="302" width="160" height="44" rx="22"/>
          <rect x="312" y="250" width="132" height="52" rx="11"/>
        </g>
        <g fill="white" stroke="none">
          <rect x="292" y="302" width="160" height="44" rx="22"/>
          <rect x="312" y="250" width="132" height="52" rx="11"/>
        </g>
        <!-- crawler details -->
        <g fill="black">
          <circle cx="316" cy="324" r="13"/>
          <circle cx="428" cy="324" r="13"/>
          <circle cx="347" cy="336" r="6"/>
          <circle cx="372" cy="336" r="6"/>
          <circle cx="397" cy="336" r="6"/>
          <rect x="324" y="260" width="34" height="32" rx="5"/>
          <rect x="398" y="260" width="34" height="8" rx="4"/>
          <rect x="398" y="276" width="34" height="8" rx="4"/>
        </g>
      </g>
    </mask>
  </defs>
  <!-- final mark: ink, for light surfaces -->
  <rect width="512" height="512" fill="#111111" mask="url(#mark)"/>
</svg>
